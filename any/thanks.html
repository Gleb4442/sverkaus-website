<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>any</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1c1c1c">
  <link rel="icon" type="image/png" sizes="32x32" href="/any/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/any/assets/img/apple-touch-icon.png">
  <style>
    /* After payment: the ghost wordmark fills with light and becomes solid. One line. Nothing else. */
    :root{--ink:#f4f4f1;--soft:#9d9d9a;--quiet:#6f6f6c;--e:cubic-bezier(.22,1,.36,1);--e2:cubic-bezier(.65,0,.35,1);
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 72px;
      background:radial-gradient(80% 60% at 50% 42%,#2a2a29 0,#212120 55%,#1c1c1c 100%) fixed,#1c1c1c;color:var(--ink);
      font:400 17px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-align:center}
    :focus-visible{outline:2px solid #9dbcff;outline-offset:3px;border-radius:8px}

    .wm{position:relative;width:min(560px,80vw);aspect-ratio:745/370;cursor:default}
    .wm svg{position:absolute;inset:0;width:100%;height:100%}
    .wm-ghost{opacity:0}
    .go .wm-ghost{animation:fade 1s ease .1s both}
    .wm-solid{color:var(--ink);-webkit-mask-image:linear-gradient(to top,#000 42%,transparent 58%);mask-image:linear-gradient(to top,#000 42%,transparent 58%);
      -webkit-mask-size:100% 260%;mask-size:100% 260%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 0;mask-position:0 0}
    .go .wm-solid{animation:fill 2.1s var(--e2) .45s both}
    @keyframes fill{from{-webkit-mask-position:0 0;mask-position:0 0}to{-webkit-mask-position:0 100%;mask-position:0 100%}}
    @keyframes fade{from{opacity:0}to{opacity:1}}

    .line{margin-top:clamp(18px,3vh,30px);font-size:clamp(22px,2.4vw,30px);font-weight:500;letter-spacing:-.02em;color:var(--soft);opacity:0}
    .go .line{animation:rise 1s var(--e) 1.9s both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* the only other thing: a quiet way out if activation does not happen */
    .help{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 32px));transform:translateX(-50%);opacity:0}
    .go .help{animation:fade 1s ease 2.6s both}
    .help summary{display:inline-block;padding:7px 12px;border-radius:999px;font-size:13px;color:var(--quiet);cursor:pointer;list-style:none;transition:color .2s,background .2s}
    .help summary::-webkit-details-marker{display:none}
    .help summary:hover,.help[open] summary{color:#d8d8d5;background:rgba(255,255,255,.06)}
    .help-card{position:absolute;left:0;right:0;bottom:calc(100% + 10px);padding:16px 20px;border-radius:22px;font-size:14px;line-height:1.5;color:#d5d5d2;text-align:left;
      background:linear-gradient(145deg,rgba(64,64,62,.7),rgba(40,40,39,.6) 50%,rgba(56,56,54,.66));-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
      box-shadow:0 18px 44px rgba(0,0,0,.36)}
    .help[open] .help-card{animation:rise .4s var(--e) both}
    .help-card a{color:#fff}
    :lang(ja) .help-card{word-break:auto-phrase}
  </style>
</head>
<body>

  <h1 class="line" data-k="line">Теперь ваш.</h1>
</main>

<details class="help">
  <summary data-k="q">Не включилось?</summary>
  <div class="help-card" data-kh="a">Проверьте интернет и откройте меню any → «Активировать лицензию…». Не помогло — напишите на <a href="mailto:main@sverkaus.com">main@sverkaus.com</a> с номером заказа из письма Creem.</div>
</details>

<script>
(function () {
  var M = "<a href='mailto:main@sverkaus.com'>main@sverkaus.com</a>";
  var K = {
    line: { ru: "Теперь ваш.", en: "Yours now.", zh: "现在归你了。", hi: "अब यह आपका है।", fr: "Il est à vous.", de: "Jetzt gehört es Ihnen.", es: "Ya es tuyo.", ko: "이제 당신의 것입니다.", ja: "これであなたのものです。" },
    q: { ru: "Не включилось?", en: "Didn’t unlock?", zh: "没有解锁？", hi: "अनलॉक नहीं हुआ?", fr: "Rien ne change ?", de: "Nicht freigeschaltet?", es: "¿No se activó?", ko: "활성화되지 않았나요?", ja: "有効にならない場合" },
    a: {
      ru: "Проверьте интернет и откройте меню any → «Активировать лицензию…». Не помогло — напишите на " + M + " с номером заказа из письма Creem.",
      en: "Check your connection and open the any menu → Activate License…. Still nothing? Email " + M + " with the order ID from your Creem receipt.",
      zh: "请检查网络连接，然后在 any 菜单中激活许可证。仍未解决？请发邮件至 " + M + "，并附上 Creem 收据中的订单号。",
      hi: "इंटरनेट जाँचें और any मेनू से लाइसेंस सक्रिय करें। फिर भी नहीं? Creem रसीद का ऑर्डर नंबर लेकर " + M + " पर लिखें।",
      fr: "Vérifiez votre connexion et activez la licence depuis le menu any. Toujours rien ? Écrivez à " + M + " avec le numéro de commande du reçu Creem.",
      de: "Prüfen Sie die Verbindung und aktivieren Sie die Lizenz im any-Menü. Immer noch nichts? Schreiben Sie an " + M + " mit der Bestellnummer aus der Creem-Quittung.",
      es: "Comprueba la conexión y activa la licencia desde el menú de any. ¿Nada? Escribe a " + M + " con el número de pedido del recibo de Creem.",
      ko: "인터넷 연결을 확인하고 any 메뉴에서 라이선스를 활성화하세요. 그래도 안 되면 Creem 영수증의 주문 번호와 함께 " + M + "로 메일을 보내 주세요.",
      ja: "接続を確認し、any メニューからライセンスを有効にしてください。それでも駄目なら、Creem の領収書の注文番号を添えて " + M + " までご連絡ください。"
    }
  };
  // Same language choice as the site: saved pick (any-lang), then the browser's languages.
  var LANGS = Object.keys(K.line), lang = "en", saved = null;
  try { saved = localStorage.getItem("any-lang"); } catch (e) {}
  if (saved && LANGS.indexOf(saved) >= 0) lang = saved;
  else {
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) { var c = String(list[i] || "").toLowerCase().split("-")[0]; if (LANGS.indexOf(c) >= 0) { lang = c; break; } }
  }
  var html = document.documentElement;
  html.lang = lang === "zh" ? "zh-Hans" : lang;
  document.querySelectorAll("[data-k]").forEach(function (el) { el.textContent = K[el.dataset.k][lang]; });
  document.querySelectorAll("[data-kh]").forEach(function (el) { el.innerHTML = K[el.dataset.kh][lang]; });

  function play() { html.classList.remove("go"); void html.offsetWidth; html.classList.add("go"); }
  function start() { (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(play); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
  document.querySelector(".wm").addEventListener("click", play);
})();
</script>
