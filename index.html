<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Sverkaus Labs">
    <title>Sverkaus Labs</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1c1c1c;
            --text-color: #f0f0f0;
            --accent-color: #a3e635;
            --dim-color: #666666;
            --tagline-color: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', monospace;
            cursor: crosshair;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-left-label {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.8s;
        }

        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            width: 100%;
        }

        .logo-icon-container {
            width: 130px;
            height: 130px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.3s;
        }

        .logo-icon {
            width: 100%;
            height: 100%;
            transform-origin: center;
            will-change: transform;
        }

        .logo-center {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 300;
            letter-spacing: 0.25em;
            margin-left: 0.25em; /* Compensate for the last letter's tracking */
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0f0f0;
            text-shadow: 0px 0px 20px rgba(163, 230, 53, 0.3);
            white-space: nowrap;
        }

        .logo-center span {
            opacity: 0;
            display: inline-block;
            animation: fadeIn 0.8s ease forwards;
        }

        .tagline {
            font-size: 14px;
            color: var(--tagline-color);
            letter-spacing: 0.05em;
            text-align: center;
            min-height: 20px; /* prevent layout shift during typing */
        }

        /* Animation 1: Blinking Cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: var(--accent-color);
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .bottom-projects {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            padding: 0 20px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 1s;
        }

        .project {
            font-size: 12px;
            color: var(--dim-color);
            text-align: center;
            line-height: 1.5;
            width: max-content;
            position: relative;
            padding: 0 20px; /* Space for brackets */
            transition: color 0.2s;
            white-space: nowrap;
            cursor: pointer;
        }

        /* Animation 4: Targeting Brackets */
        .project::before, .project::after {
            position: absolute;
            opacity: 0;
            color: var(--accent-color);
            font-weight: bold;
            transition: all 0.2s ease;
            top: 0;
        }
        
        .project::before {
            content: "[";
            left: 0;
            transform: translateX(10px);
        }
        
        .project::after {
            content: "]";
            right: 0;
            transform: translateX(-10px);
        }

        .project:hover::before, .project:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        .project:hover {
            color: #888;
        }

        .project:hover a {
            color: var(--accent-color);
            text-decoration: underline;
            text-decoration-color: var(--accent-color);
        }

        .project .diamond {
            color: var(--text-color);
            transition: color 0.2s;
        }

        .project:hover .diamond {
            color: var(--accent-color);
        }

        .project .project-name {
            color: var(--accent-color);
            font-weight: 700;
            display: inline-block;
            min-width: 65px; /* Prevent jitter during glitch */
        }

        a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s ease;
            position: relative;
        }

        a:hover {
            color: var(--accent-color);
            text-decoration: underline;
            text-decoration-color: var(--accent-color);
        }

        .site-footer {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .footer-content {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            color: var(--dim-color);
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: none;
            box-sizing: border-box;
        }

        .social-link:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        
        .social-link.telegram-link svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 12;
            width: 22px;
            height: 22px;
        }

        .top-right-langs {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.8s;
        }

        /* Custom Select Styles */
        .custom-select {
            position: relative;
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            user-select: none;
            width: 85px;
        }

        .select-trigger {
            background: rgba(255, 255, 255, 0.02);
            color: var(--dim-color);
            border: 1px solid transparent;
            border-radius: 30px;
            padding: 6px 12px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: inherit;
        }

        .select-trigger * {
            pointer-events: none;
        }

        .select-trigger:hover, .select-trigger:focus, .custom-select.active .select-trigger {
            color: var(--text-color);
            border-color: transparent;
            background-color: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 10px rgba(163, 230, 53, 0.05);
        }

        .select-options {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 6px;
            padding: 4px 0;
            list-style: none;
            background: rgba(28, 28, 28, 0.95);
            border: none;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            width: 100%;
            box-sizing: border-box;
        }

        .custom-select.active .select-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .select-option {
            padding: 7px 12px;
            color: var(--dim-color);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            border-radius: 20px;
            margin: 2px 4px;
        }

        .select-option:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.04);
        }

        .select-option.selected {
            color: var(--accent-color);
            background: rgba(163, 230, 53, 0.04);
        }

        @media (max-width: 768px) {
            .top-left-label {
                display: none; /* Hide top-left label on mobile to save space and avoid clutter */
            }
            .logo-icon-container {
                width: 90px;
                height: 90px;
                margin-bottom: 20px;
            }
            .logo-center {
                font-size: clamp(24px, 8vw, 42px);
                letter-spacing: 0.15em;
                margin-left: 0.15em;
            }
            .tagline {
                padding: 0 20px;
                font-size: 13px;
            }
            .bottom-projects {
                position: relative;
                bottom: 0;
                padding: 20px 20px 20px 20px;
                margin-top: 40px;
            }
            .center-content {
                padding-top: 80px;
            }
            .project {
                margin-bottom: 16px;
                padding: 0 15px;
                width: 100%;
                max-width: 550px;
                white-space: normal;
                word-break: normal;
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
            .project::before, .project::after {
                display: none; /* Disable brackets on mobile to avoid mess */
            }
        }

        /* Update Badge Styles */
        .update-badge-container {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 11px;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 1.2s;
            margin-top: 25px;
            user-select: none;
        }

        .update-badge-container:hover {
            background: rgba(163, 230, 53, 0.03);
            border-color: rgba(163, 230, 53, 0.3);
            box-shadow: 0 0 15px rgba(163, 230, 53, 0.08);
            transform: translateY(-1px);
        }

        .update-badge-container a.badge-main-target {
            display: flex;
            align-items: center;
            color: var(--text-color);
            text-decoration: none;
        }

        .update-badge-container a.badge-main-target:hover {
            color: var(--text-color);
            text-decoration: none;
        }

        .badge-new {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: 700;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-right: 8px;
            letter-spacing: 0.08em;
            display: inline-block;
            line-height: 1;
        }

        .badge-title {
            color: var(--text-color);
            font-weight: 400;
        }

        .badge-separator {
            color: rgba(255, 255, 255, 0.15);
            user-select: none;
            font-size: 10px;
        }

        .update-badge-container a.badge-info {
            color: var(--dim-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .update-badge-container a.badge-info:hover {
            color: var(--accent-color);
            text-decoration: underline;
            text-decoration-color: var(--accent-color);
        }

    </style>
</head>

    <script>
        // Translation Dictionary
        const translations = {
            en: {
                tagline: "Simplifying human-to-human interaction",
                projects: {
                    beajee: "Applied Social Network for Autonomous Networking via Personal Agent like OpenClaw",
                    gennety: "Dating social network for IRL — no chat before meeting"
                },
                badgeInfo: "Details →"
            },
            zh: {
                tagline: "简化人与人之间的互动",
                projects: {
                    beajee: "基于个人智能体（如 OpenClaw）实现自主社交的应用型社交网络",
                    gennety: "真实生活约会社交网络 — 见面之前无需聊天"
                },
                badgeInfo: "详情 →"
            },
            hi: {
                tagline: "मानव-से-मानव संपर्क को सरल बनाना",
                projects: {
                    beajee: "व्यक्तिगत एजेंट (जैसे OpenClaw) के माध्यम से स्वायत्त नेटवर्किंग के लिए व्यावहारिक सोशल नेटवर्क",
                    gennety: "वास्तविक जीवन (IRL) के लिए डेटिंग सोशल नेटवर्क — मिलने से पहले कोई चैट नहीं"
                },
                badgeInfo: "विवरण →"
            },
            ko: {
                tagline: "사람과 사람 사이의 상호작용을 단순화합니다",
                projects: {
                    beajee: "OpenClaw와 같은 개인 에이전트를 통한 자율 네트워크용 응용 소셜 네트워크",
                    gennety: "IRL을 위한 데이팅 소셜 네트워크 — 만나기 전 채팅 없음"
                },
                badgeInfo: "상세보기 →"
            },
            de: {
                tagline: "Vereinfachung der zwischenmenschlichen Interaktion",
                projects: {
                    beajee: "Anwendungsorientiertes soziales Netzwerk für autonome Vernetzung über persönliche Agenten wie OpenClaw",
                    gennety: "Dating-Netzwerk für das echte Leben (IRL) – kein Chatten vor dem Treffen"
                },
                badgeInfo: "Details →"
            },
            pl: {
                tagline: "Upraszczanie interakcji międzyludzkich",
                projects: {
                    beajee: "Aplikacyjna sieć społecznościowa do autonomicznego nawiązywania kontaktów za pośrednictwem osobistych agentów, takich jak OpenClaw",
                    gennety: "Sieć randkowa w świecie rzeczywistym (IRL) – bez czatu przed spotkaniem"
                },
                badgeInfo: "Szczegóły →"
            }
        };

        // Language state management
        let currentLang = localStorage.getItem('sverkaus-lang') || 'en';
        if (!translations[currentLang]) {
            currentLang = 'en';
        }

        // Animation 1: Typing Effect
        const typeElement = document.getElementById('typewriter');
        const cursorElement = document.querySelector('.cursor');
        let typeIndex = 0;
        let currentText = "";
        let typeTimeout = null;
        let cursorTimeout = null;

        function startTypewriter(text) {
            clearTimeout(typeTimeout);
            clearTimeout(cursorTimeout);
            typeElement.textContent = "";
            typeIndex = 0;
            currentText = text;
            
            // Show cursor
            cursorElement.style.visibility = 'visible';
            
            typeWriter();
        }

        function typeWriter() {
            if (typeIndex < currentText.length) {
                typeElement.textContent += currentText.charAt(typeIndex);
                typeIndex++;
                typeTimeout = setTimeout(typeWriter, 40 + Math.random() * 40); // Random typing speed
            } else {
                // Done typing: let the cursor blink a couple of times and then disappear
                cursorTimeout = setTimeout(() => {
                    cursorElement.style.visibility = 'hidden';
                }, 1500);
            }
        }

        // Custom select UI update helper
        function updateCustomSelectUI(lang) {
            const selectOptions = document.querySelectorAll('.select-option');
            const selectedText = document.getElementById('lang-selected-text');
            let selectedOptionText = "EN";
            
            selectOptions.forEach(opt => {
                if (opt.getAttribute('data-value') === lang) {
                    opt.classList.add('selected');
                    opt.setAttribute('aria-selected', 'true');
                    selectedOptionText = opt.textContent;
                } else {
                    opt.classList.remove('selected');
                    opt.removeAttribute('aria-selected');
                }
            });
            if (selectedText) {
                selectedText.textContent = selectedOptionText;
            }
        }

        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            localStorage.setItem('sverkaus-lang', currentLang);

            // Update language selector dropdown value if changed programmatically
            const langSelect = document.getElementById('lang-select');
            if (langSelect && langSelect.value !== currentLang) {
                langSelect.value = currentLang;
            }

            // Sync custom select UI
            updateCustomSelectUI(currentLang);

            // Update tagline via typewriter
            startTypewriter(translations[currentLang].tagline);

            // Update project descriptions
            document.getElementById('desc-beajee').textContent = translations[currentLang].projects.beajee;
            document.getElementById('desc-gennety').textContent = translations[currentLang].projects.gennety;

            // Update badge translation
            document.getElementById('badge-info-link').textContent = translations[currentLang].badgeInfo;
        }

        // Initialize translations on load
        const langSelect = document.getElementById('lang-select');
        if (langSelect) {
            langSelect.value = currentLang;
            langSelect.addEventListener('change', (e) => {
                switchLanguage(e.target.value);
            });
        }

        // Setup custom language select event listeners
        const customSelect = document.getElementById('custom-lang-select');
        const selectTrigger = document.getElementById('lang-select-trigger');
        const selectOptions = document.querySelectorAll('.select-option');

        if (customSelect && selectTrigger) {
            updateCustomSelectUI(currentLang);

            selectTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                const isActive = customSelect.classList.toggle('active');
                selectTrigger.setAttribute('aria-expanded', isActive ? 'true' : 'false');
            });

            selectOptions.forEach(option => {
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const lang = option.getAttribute('data-value');
                    switchLanguage(lang);
                    customSelect.classList.remove('active');
                    selectTrigger.setAttribute('aria-expanded', 'false');
                });
            });

            document.addEventListener('click', () => {
                customSelect.classList.remove('active');
                selectTrigger.setAttribute('aria-expanded', 'false');
            });
        }
        
        document.getElementById('desc-beajee').textContent = translations[currentLang].projects.beajee;
        document.getElementById('desc-gennety').textContent = translations[currentLang].projects.gennety;
        document.getElementById('badge-info-link').textContent = translations[currentLang].badgeInfo;

        // Start typing tagline
        setTimeout(() => {
            startTypewriter(translations[currentLang].tagline);
        }, 600);

        // Animation 2: Matrix Decode (Glitch) and Click to open site
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        
        document.querySelectorAll('.project').forEach(project => {
            const el = project.querySelector('.project-name');
            const link = project.querySelector('a');
            
            // Glitch effect on hovering the project row
            if (el) {
                project.addEventListener('mouseenter', () => {
                    let iterations = 0;
                    const originalText = el.dataset.value;
                    
                    clearInterval(el.dataset.interval);
                    
                    el.dataset.interval = setInterval(() => {
                        el.innerText = originalText.split("")
                            .map((letter, index) => {
                                if(index < iterations) {
                                    return originalText[index];
                                }
                                return letters[Math.floor(Math.random() * letters.length)];
                            })
                            .join("");
                        
                        if(iterations >= originalText.length){
                            clearInterval(el.dataset.interval);
                        }
                        
                        iterations += 1 / 3; // Controls speed of decode
                    }, 30);
                });
            }

            // Click listener for the entire row
            project.addEventListener('click', (event) => {
                // If clicked directly on the anchor, let the browser handle it naturally
                if (event.target.tagName === 'A') return;
                
                if (link) {
                    window.open(link.href, link.target || '_blank');
                }
            });
        });
    </script>
</body>
</html>
